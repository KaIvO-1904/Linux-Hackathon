# Local simulation of department sources using syslog facilities.
# local0=traffic, local1=safety, local2=water, local3=utilities

if ($syslogfacility-text == "local0") then {
    action(type="omfile" file="/srv/smartcity/logs/traffic/traffic.log" createDirs="on")
    stop
}

if ($syslogfacility-text == "local1") then {
    action(type="omfile" file="/srv/smartcity/logs/safety/safety.log" createDirs="on")
    stop
}

if ($syslogfacility-text == "local2") then {
    action(type="omfile" file="/srv/smartcity/logs/water/water.log" createDirs="on")
    stop
}

if ($syslogfacility-text == "local3") then {
    action(type="omfile" file="/srv/smartcity/logs/utilities/utilities.log" createDirs="on")
    stop
}
